<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="680" height="340" fill="#ffffff"/>

<!-- Mg2+ coordination cluster -->
<circle cx="365" cy="50" r="9" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="380" y="54" font-size="12" fill="#333">H₂O</text>
<circle cx="455" cy="50" r="9" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="465" y="54" font-size="12" fill="#333">H₂O</text>
<circle cx="410" cy="90" r="14" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"/>
<text x="410" y="94" font-size="13" font-weight="bold" fill="#173404" text-anchor="middle">Mg</text>
<line x1="365" y1="50" x2="399" y2="82" stroke="#555" stroke-width="0.7"/>
<line x1="455" y1="50" x2="421" y2="82" stroke="#555" stroke-width="0.7"/>
<line x1="399" y1="100" x2="380" y2="132" stroke="#555" stroke-width="0.7"/>
<line x1="421" y1="100" x2="445" y2="132" stroke="#555" stroke-width="0.7"/>
<line x1="424" y1="90" x2="556" y2="90" stroke="#888" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="562" y="94" font-size="11" fill="#555">koordinuje β,γ-O + Ser/Thr-OH</text>

<!-- Adenine and ribose -->
<rect x="40" y="190" width="90" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="85" y="216" font-size="14" text-anchor="middle" fill="#2C2C2A">Adenin</text>
<rect x="150" y="190" width="90" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="195" y="216" font-size="14" text-anchor="middle" fill="#2C2C2A">Ribóza</text>
<line x1="130" y1="212" x2="150" y2="212" stroke="#555" stroke-width="0.7"/>
<line x1="240" y1="212" x2="272" y2="164" stroke="#555" stroke-width="0.7"/>

<!-- Phosphates -->
<circle cx="300" cy="160" r="28" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text x="300" y="165" font-size="16" font-weight="bold" fill="#4A1B0C" text-anchor="middle">α</text>
<circle cx="375" cy="160" r="28" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text x="375" y="165" font-size="16" font-weight="bold" fill="#4A1B0C" text-anchor="middle">β</text>
<circle cx="450" cy="160" r="28" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text x="450" y="165" font-size="16" font-weight="bold" fill="#4A1B0C" text-anchor="middle">γ</text>
<line x1="328" y1="160" x2="347" y2="160" stroke="#555" stroke-width="0.7"/>
<text x="337" y="150" font-size="12" text-anchor="middle" fill="#555">O</text>
<line x1="403" y1="160" x2="422" y2="160" stroke="#555" stroke-width="0.7"/>
<text x="412" y="150" font-size="12" text-anchor="middle" fill="#555">O</text>
<text x="486" y="140" font-size="12" text-anchor="middle" fill="#555">O⁻</text>
<text x="486" y="184" font-size="12" text-anchor="middle" fill="#555">O⁻</text>

<!-- P-loop backbone -->
<rect x="310" y="205" width="160" height="90" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="390" y="230" font-size="14" text-anchor="middle" fill="#2C2C2A">P-loop backbone</text>
<text x="390" y="248" font-size="12" text-anchor="middle" fill="#5F5E5A">Gly-x-x-x-x-Gly (NH)</text>
<circle cx="375" cy="205" r="5" fill="#5F5E5A"/>
<circle cx="450" cy="205" r="5" fill="#5F5E5A"/>
<line x1="375" y1="188" x2="375" y2="205" stroke="#5F5E5A" stroke-width="1.2"/>
<line x1="450" y1="188" x2="450" y2="205" stroke="#5F5E5A" stroke-width="1.2"/>

<!-- Lysine bidentate contact -->
<rect x="490" y="205" width="110" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<text x="545" y="231" font-size="14" font-weight="bold" text-anchor="middle" fill="#042C53">Lys NH₃⁺</text>
<line x1="490" y1="215" x2="472" y2="148" stroke="#555" stroke-width="0.7" stroke-dasharray="2 3"/>
<line x1="490" y1="235" x2="472" y2="178" stroke="#555" stroke-width="0.7" stroke-dasharray="2 3"/>
</svg>
